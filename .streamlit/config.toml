[theme]
base = "light"
primaryColor = "#C8661E"
backgroundColor = "#FFF8F0"
secondaryBackgroundColor = "#F7E6D3"
textColor = "#3B2A1E"

[server]
headless = true
enableStaticServing = true  # phục vụ thư mục static/ tại /app/static/ (ảnh nền trang đăng nhập)

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"  # ẩn Deploy và các mục dành cho người lập trình
